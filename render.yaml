# Render-Blueprint (optional). Der bestehende Dienst «if-bot-3» kann auch von Hand
# mit denselben Werten eingestellt werden – siehe README.md.
services:
  - type: web
    name: if-bot-3
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
